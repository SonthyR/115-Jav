name: Publish 115-Jav image

# 推送 master：只更新 latest 和 sha-xxx 镜像。
# 推送 v1.2.3 标签，或在 Actions 页手动运行并填版本号：额外发布 1.2.3 / 1.2 / 1 镜像和 GitHub Release。
on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，如 1.0.0（会在当前提交上打 v1.0.0 标签）"
        required: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/sonthyr/115-jav

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            echo "version=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: '$version' (expected e.g. 1.2.3)" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Tag the commit for a manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists."
            exit 0
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${VERSION}" -f sha="${GITHUB_SHA}"

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.version != ''
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          # 只列出 fork 之后的改动（8368c78 是上游 Miyabi v0.2.1）
          args: -vv --tag v${{ needs.version.outputs.version }} 8368c78a1d6616671a7f8c138a8b0d517d05b046..HEAD
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          # 私有仓库读 PR 信息需要令牌
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-draft-release:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [version, changelog]
    if: needs.version.outputs.version != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Draft Release
        shell: bash
        run: |
          tag="v${VERSION}"

          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub release '$tag' already exists; keeping the existing release body."
            exit 0
          fi

          printf '%s\n' "$RELEASE_BODY" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Release $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_BODY: ${{ needs.changelog.outputs.release_body }}

  # Go 和前端都在构建机原生架构下交叉编译，只有运行时层走 QEMU，
  # 所以一个 job 直接构建并推送多架构镜像，不依赖 arm 专用 runner（私有仓库不可用）。
  publish:
    name: Build and push multi-arch image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.version != '' }}
            type=semver,pattern={{major}},value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.version != '' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push (multi-arch)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version || 'dev' }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=115-jav
          cache-to: type=gha,scope=115-jav,mode=max
          provenance: false
          sbom: false

  publish-release:
    name: Publish release
    needs: [version, create-draft-release, publish]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        run: gh release edit "v${VERSION}" --draft=false --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
